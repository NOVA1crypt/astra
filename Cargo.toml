[package]
name        = "astra"
version     = "0.1.0"
edition     = "2021"
description = "Astra — navigateur web cross-platform (macOS, Linux, Windows)"
license     = "MIT"

[[bin]]
name = "astra"
path = "src/main.rs"

[dependencies]
wry        = "0.44"
tao        = "0.29"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite   = { version = "0.32", features = ["bundled"] }
url        = "2"

[profile.release]
opt-level = 3
lto       = true
strip     = true
