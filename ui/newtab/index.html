<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1e1e2e;
      color: #cdd6f4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 28px;
    }

    .logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .logo-name {
      font-size: 3rem;
      font-weight: 200;
      letter-spacing: 0.15em;
      color: #cdd6f4;
    }
    .logo-name span { color: #89b4fa; }
    .logo-sub {
      font-size: 0.8rem;
      letter-spacing: 0.3em;
      color: #6c7086;
      text-transform: uppercase;
    }

    .search-box {
      display: flex;
      width: 560px;
      background: #313244;
      border-radius: 14px;
      overflow: hidden;
      border: 1.5px solid #45475a;
      transition: border-color 0.2s;
    }
    .search-box:focus-within { border-color: #89b4fa; }
    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      color: #cdd6f4;
      font-size: 15px;
      padding: 13px 20px;
      outline: none;
    }
    .search-box input::placeholder { color: #6c7086; }
    .search-box button {
      background: #89b4fa;
      border: none;
      color: #1e1e2e;
      padding: 0 22px;
      font-size: 16px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.15s;
    }
    .search-box button:hover { background: #b4befe; }

    .shortcuts {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 580px;
    }
    .shortcut {
      background: #313244;
      border-radius: 12px;
      padding: 10px 16px;
      text-decoration: none;
      color: #cdd6f4;
      font-size: 13px;
      transition: background 0.15s;
      border: 1px solid #45475a;
    }
    .shortcut:hover { background: #45475a; }
  </style>
</head>
<body>
  <div class="logo">
    <div class="logo-name"><span>A</span>stra</div>
    <div class="logo-sub">Web Browser</div>
  </div>

  <div class="search-box">
    <input id="q" type="text" placeholder="Rechercher sur le web..." autofocus>
    <button onclick="go()">&#8594;</button>
  </div>

  <div class="shortcuts">
    <a class="shortcut" href="https://github.com">GitHub</a>
    <a class="shortcut" href="https://www.youtube.com">YouTube</a>
    <a class="shortcut" href="https://news.ycombinator.com">Hacker News</a>
    <a class="shortcut" href="https://www.wikipedia.org">Wikipedia</a>
    <a class="shortcut" href="https://www.reddit.com">Reddit</a>
  </div>

  <script>
    function go() {
      const q = document.getElementById('q').value.trim();
      if (!q) return;
      const isUrl = /^https?:\/\//i.test(q) || (/^[\w.-]+\.\w{2,}$/.test(q) && !q.includes(' '));
      location.href = isUrl
        ? (q.includes('://') ? q : 'https://' + q)
        : 'https://search.brave.com/search?q=' + encodeURIComponent(q);
    }
    document.getElementById('q').addEventListener('keydown', e => {
      if (e.key === 'Enter') go();
    });
  </script>
</body>
</html>
