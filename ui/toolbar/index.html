<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1e1e2e;
      display: flex;
      align-items: center;
      height: 52px;
      padding: 0 8px;
      gap: 6px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-user-select: none;
      user-select: none;
      overflow: hidden;
    }

    .btn {
      background: transparent;
      border: none;
      color: #cdd6f4;
      font-size: 18px;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .btn:hover  { background: #313244; }
    .btn:active { background: #45475a; }
    .btn:disabled { opacity: 0.3; cursor: default; pointer-events: none; }

    #url-bar {
      flex: 1;
      height: 34px;
      background: #313244;
      border: 1.5px solid transparent;
      border-radius: 10px;
      color: #cdd6f4;
      font-size: 14px;
      padding: 0 12px;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
      -webkit-user-select: text;
      user-select: text;
    }
    #url-bar:focus { border-color: #89b4fa; background: #1e1e2e; }
    #url-bar::placeholder { color: #6c7086; }

    #spinner {
      width: 16px;
      height: 16px;
      border: 2.5px solid #45475a;
      border-top-color: #89b4fa;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    body.loading #spinner    { display: block; }
    body.loading #reload-btn { display: none; }
  </style>
</head>
<body>
  <button class="btn" id="back-btn"   title="Précédent">&#8592;</button>
  <button class="btn" id="fwd-btn"    title="Suivant">&#8594;</button>
  <button class="btn" id="reload-btn" title="Recharger">&#8635;</button>
  <div id="spinner"></div>

  <input
    id="url-bar"
    type="text"
    placeholder="Rechercher ou entrer une adresse..."
    autocomplete="off"
    spellcheck="false"
  >

  <button class="btn" id="home-btn" title="Accueil">&#8962;</button>

  <script>
    function send(type, extra) {
      const msg = JSON.stringify(extra ? { type, ...extra } : { type });
      window.location.href = 'astra-ipc://x?msg=' + encodeURIComponent(msg);
    }

    document.getElementById('back-btn').onclick   = () => send('back');
    document.getElementById('fwd-btn').onclick    = () => send('forward');
    document.getElementById('reload-btn').onclick = () => send('reload');
    document.getElementById('home-btn').onclick   = () => send('navigate', { url: 'astra://home' });

    const bar = document.getElementById('url-bar');

    bar.addEventListener('keydown', e => {
      if (e.key === 'Enter') { send('navigate', { url: bar.value.trim() }); bar.blur(); }
      if (e.key === 'Escape') bar.blur();
    });

    bar.addEventListener('focus', () => bar.select());

    function setUrl(url) {
      if (document.activeElement !== bar) bar.value = url;
      document.body.classList.remove('loading');
    }

    function setLoading(on) {
      document.body.classList.toggle('loading', on);
    }

    function setNavState(canBack, canForward) {
      document.getElementById('back-btn').disabled = !canBack;
      document.getElementById('fwd-btn').disabled  = !canForward;
    }

    setNavState(false, false);

    document.addEventListener('keydown', e => {
      const mod = e.metaKey || e.ctrlKey;
      if (mod && e.key === 'l') { e.preventDefault(); bar.focus(); bar.select(); }
      if (mod && e.key === 'r') { e.preventDefault(); send('reload'); }
      if (e.key === 'F5')       { e.preventDefault(); send('reload'); }
    });
  </script>
</body>
</html>
